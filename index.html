<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Garage GO! — Match-3</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #2c3540;
      --bg-panel: #37424f;
      --border-dark: #1e252d;
      --cream-bg: #f7eedc;
      --blue-btn: #5eb8e8;
      --blue-shadow: #337ca8;
      --pink-btn: #e86a78;
      --pink-shadow: #a83c48;
      --gold: #fbbf24;
      --gold-shadow: #b45309;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Rubik', sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #1a2027; display: flex; justify-content: center; align-items: center; }
    #app { position: relative; width: 100%; max-width: 430px; height: 100%; max-height: 932px; background: radial-gradient(circle at 50% 45%, #5b6978 0%, #2c3540 75%); overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .top-bar { position: relative; z-index: 10; padding: 14px 12px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .profile-pill { display: flex; align-items: center; background: var(--bg-panel); border: 3px solid var(--border-dark); border-radius: 40px; padding: 4px 14px 4px 4px; box-shadow: 0 5px 0 var(--border-dark); color: #fff; }
    .avatar-circle { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #a76e58, #6b4335); border: 3px solid #eab676; display: flex; align-items: center; justify-content: center; font-size: 24px; position: relative; margin-right: 8px; }
    .level-badge { position: absolute; bottom: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); border: 2px solid var(--border-dark); color: #fff; font-size: 11px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .profile-info h3 { font-size: 15px; font-weight: 800; line-height: 1.1; }
    .profile-info p { font-size: 11px; color: #b8c4d0; font-weight: 600; }
    .resources-panel { display: flex; background: var(--bg-panel); border: 3px solid var(--border-dark); border-radius: 18px; padding: 6px 10px 10px; gap: 10px; box-shadow: 0 5px 0 var(--border-dark); }
    .res-item { display: flex; flex-direction: column; align-items: center; min-width: 44px; }
    .res-emoji { font-size: 25px; line-height: 32px; }
    .res-count { background: #925c35; border: 2px solid var(--border-dark); border-radius: 10px; padding: 1px 8px; color: #fff; font-size: 12px; font-weight: 800; }
    .goal-banner { position: relative; z-index: 10; margin: 10px auto 0 12px; background: var(--cream-bg); border: 3px solid var(--border-dark); border-radius: 16px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 5px 0 #8c7b65; cursor: pointer; touch-action: manipulation; }
    .goal-text span { display: block; font-size: 11px; color: #6b5e4c; font-weight: 600; }
    .goal-text strong { font-size: 14px; color: #1f1b16; font-weight: 800; }
    .bottom-area { position: relative; z-index: 10; margin-top: auto; padding: 0 14px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .speech-bubble { background: var(--cream-bg); border: 3px solid var(--border-dark); border-radius: 16px; padding: 10px 20px; font-size: 15px; font-weight: 800; color: #1f1b16; box-shadow: 0 5px 0 #8c7b65; }
    .main-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
    .btn-3d { position: relative; border: 3.5px solid var(--border-dark); border-radius: 22px; padding: 18px 10px; font-size: 24px; font-weight: 900; color: #fff; text-transform: uppercase; cursor: pointer; text-shadow: 0 2px 0 rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
    .btn-tasks { background: var(--blue-btn); box-shadow: 0 8px 0 var(--blue-shadow); }
    .btn-tasks:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--blue-shadow); }
    .btn-play { background: var(--pink-btn); box-shadow: 0 8px 0 var(--pink-shadow); }
    .btn-play:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--pink-shadow); }
    .badge-tuning { position: absolute; top: -15px; right: 12px; background: #dc2626; border: 2.5px solid var(--border-dark); border-radius: 10px; padding: 2px 9px; font-size: 12px; font-weight: 800; color: #fff; box-shadow: 0 3px 0 #7f1d1d; }
    .badge-lvl { position: absolute; top: -16px; right: -6px; width: 44px; height: 44px; border-radius: 50%; background: var(--gold); border: 3px solid var(--border-dark); box-shadow: 0 4px 0 var(--gold-shadow); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #fff; }
    .modal-overlay { position: absolute; inset: 0; background: rgba(18, 23, 29, 0.85); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-card { width: 100%; background: var(--cream-bg); border: 4px solid var(--border-dark); border-radius: 26px; padding: 20px 16px; box-shadow: 0 10px 0 #8c7b65; color: #1f1b16; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .close-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--pink-btn); border: 2.5px solid var(--border-dark); color: #fff; font-weight: 900; cursor: pointer; box-shadow: 0 3px 0 var(--pink-shadow); touch-action: manipulation; }
    .task-item { background: #fff; border: 3px solid var(--border-dark); border-radius: 16px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 0 #d5c4a1; }
    .task-item.done { opacity: 0.6; background: #e5e7eb; }
    .task-btn { background: #22c55e; border: 2.5px solid var(--border-dark); border-radius: 12px; padding: 8px 14px; color: #fff; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 #15803d; touch-action: manipulation; }
    .match-top { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; color: #fff; }
    .match-stat { background: var(--bg-panel); border: 3px solid var(--border-dark); border-radius: 16px; padding: 8px 16px; font-weight: 800; font-size: 16px; }
    .board-grid { width: 100%; aspect-ratio: 1 / 1; background: #252e38; border: 4px solid var(--border-dark); border-radius: 22px; padding: 8px; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 6px; }
    .cell { background: rgba(255,255,255,0.05); border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation; }
    .cell.selected { background: rgba(251, 191, 36, 0.35); outline: 3px solid var(--gold); }
    .chip-img { width: 92%; height: 92%; object-fit: contain; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.45)); pointer-events: none; }
  </style>
</head>
<body>

<div id="app">
  <div class="top-bar">
    <div class="profile-pill">
      <div class="avatar-circle">👨‍🔧<div class="level-badge" id="ui-level">1</div></div>
      <div class="profile-info"><h3>Алекс</h3><p>• США • День 1</p></div>
    </div>
    <div class="resources-panel">
      <div class="res-item"><div class="res-emoji">⛽</div><div class="res-count" id="ui-fuel">5/5</div></div>
      <div class="res-item"><div class="res-emoji">🪙</div><div class="res-count" id="ui-coins">318</div></div>
      <div class="res-item"><div class="res-emoji">⭐</div><div class="res-count" id="ui-stars">0</div></div>
    </div>
  </div>

  <div>
    <div class="goal-banner" onclick="openTasks()">
      <div class="goal-text"><span>Текущая цель:</span><strong id="current-goal-title">Восстановить мотор V8</strong></div>
      <div style="font-weight:900;">⭐ 1</div>
    </div>
  </div>

  <div class="bottom-area">
    <div class="speech-bubble" id="speech-text">Этот Жеребец снова зарычит! 💪</div>
    <div class="main-actions">
      <button class="btn-3d btn-tasks" onclick="openTasks()"><span class="badge-tuning">Тюнинг ⭐</span>ЗАДАЧИ</button>
      <button class="btn-3d btn-play" onclick="startMatch3()"><span class="badge-lvl" id="play-lvl-badge">1</span>ИГРАТЬ</button>
    </div>
  </div>

  <div class="modal-overlay" id="tasks-modal">
    <div class="modal-card">
      <div class="modal-header"><h2>🔧 План работ</h2><button class="close-btn" onclick="closeTasks()">✕</button></div>
      <div id="tasks-list"></div>
    </div>
  </div>

  <div class="modal-overlay" id="match-modal">
    <div class="match-top">
      <div class="match-stat">Ходы: <span id="m-moves">15</span></div>
      <div class="match-stat">Цель: <span id="m-score">0</span> / 150</div>
      <button class="close-btn" onclick="closeMatch3()">✕</button>
    </div>
    <div class="board-grid" id="board"></div>
  </div>
</div>

<script>
  const state = {
    fuel: 5, coins: 318, stars: 0, level: 1,
    tasks: [
      { id: 1, title: 'Восстановить мотор V8', cost: 1, done: false, msg: 'Мотор V8 шепчет как новый! 🔥' },
      { id: 2, title: 'Поставить новые диски', cost: 1, done: false, msg: 'Колёса сияют! Настоящий стиль 🛞' },
      { id: 3, title: 'Полировка кузова Mustang', cost: 2, done: false, msg: 'Кузов горит как карамель! ✨' }
    ]
  };

  const CHIPS = [
    'chip_fuel.png',
    'chip_gear.png',
    'chip_wheel.png',
    'chip_spark.png',
    'chip_battery.png'
  ];

  function updateUI() {
    document.getElementById('ui-fuel').textContent = `${state.fuel}/5`;
    document.getElementById('ui-coins').textContent = state.coins;
    document.getElementById('ui-stars').textContent = state.stars;
    document.getElementById('ui-level').textContent = state.level;
    document.getElementById('play-lvl-badge').textContent = state.level;
    const nextTask = state.tasks.find(t => !t.done);
    document.getElementById('current-goal-title').textContent = nextTask ? nextTask.title : 'Всё готово! 🏆';
  }

  function openTasks() {
    const list = document.getElementById('tasks-list');
    list.innerHTML = '';
    state.tasks.forEach(t => {
      const item = document.createElement('div');
      item.className = 'task-item' + (t.done ? ' done' : '');
      item.innerHTML = `
        <div><strong>${t.title}</strong><div style="font-size:12px; color:#6b5e4c;">Награда: +50 🪙</div></div>
        ${t.done ? '<span>✅ Готово</span>' : `<button class="task-btn" onclick="completeTask(${t.id})">⭐ ${t.cost}</button>`}
      `;
      list.appendChild(item);
    });
    document.getElementById('tasks-modal').classList.add('active');
  }

  function closeTasks() { document.getElementById('tasks-modal').classList.remove('active'); }

  function completeTask(id) {
    const task = state.tasks.find(t => t.id === id);
    if (!task || task.done) return;
    if (state.stars < task.cost) {
      alert('Мало Звёзд ⭐! Сыграй в «ИГРАТЬ», чтобы заработать звезды.');
      return;
    }
    state.stars -= task.cost;
    state.coins += 50;
    task.done = true;
    document.getElementById('speech-text').textContent = task.msg;
    updateUI();
    openTasks();
  }

  const SIZE = 6;
  let grid = [], selected = null, score = 0, moves = 15, busy = false;

  function startMatch3() {
    score = 0; moves = 15; selected = null;
    document.getElementById('m-score').textContent = score;
    document.getElementById('m-moves').textContent = moves;
    document.getElementById('match-modal').classList.add('active');
    initBoard();
  }

  function closeMatch3() { document.getElementById('match-modal').classList.remove('active'); }

  function randomChip() { return Math.floor(Math.random() * CHIPS.length); }

  function initBoard() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
      grid[r] = [];
      for (let c = 0; c < SIZE; c++) {
        let type;
        do { type = randomChip(); } while (
          (c >= 2 && grid[r][c-1] === type && grid[r][c-2] === type) ||
          (r >= 2 && grid[r-1][c] === type && grid[r-2][c] === type)
        );
        grid[r][c] = type;
      }
    }
    renderBoard();
  }

  function renderBoard() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell' + (selected && selected.r === r && selected.c === c ? ' selected' : '');
        cell.onclick = () => onCellClick(r, c);
        if (grid[r][c] !== null) {
          const img = document.createElement('img');
          img.src = CHIPS[grid[r][c]];
          img.className = 'chip-img';
          cell.appendChild(img);
        }
        boardEl.appendChild(cell);
      }
    }
  }

  async function onCellClick(r, c) {
    if (busy) return;
    if (!selected) { selected = { r, c }; renderBoard(); return; }
    const dist = Math.abs(selected.r - r) + Math.abs(selected.c - c);
    if (dist === 1) {
      busy = true;
      swap(selected.r, selected.c, r, c);
      selected = null;
      renderBoard();
      if (findMatches().length > 0) {
        moves--;
        document.getElementById('m-moves').textContent = moves;
        await resolveBoard();
      } else {
        await sleep(180);
        swap(r, c, selected ? selected.r : r, selected ? selected.c : c);
      }
      busy = false;
      checkEndGame();
    } else {
      selected = { r, c };
      renderBoard();
    }
  }

  function swap(r1, c1, r2, c2) {
    const tmp = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = tmp;
  }

  function findMatches() {
    const matched = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE - 2; c++) {
        const t = grid[r][c];
        if (t !== null && grid[r][c+1] === t && grid[r][c+2] === t) matched.push({r, c}, {r, c:c+1}, {r, c:c+2});
      }
    }
    for (let c = 0; c < SIZE; c++) {
      for (let r = 0; r < SIZE - 2; r++) {
        const t = grid[r][c];
        if (t !== null && grid[r+1][c] === t && grid[r+2][c] === t) matched.push({r, c}, {r:r+1, c}, {r:r+2, c});
      }
    }
    return matched;
  }

  async function resolveBoard() {
    while (true) {
      const matched = findMatches();
      if (matched.length === 0) break;
      matched.forEach(({r, c}) => { if (grid[r][c] !== null) { grid[r][c] = null; score += 10; } });
      document.getElementById('m-score').textContent = score;
      renderBoard();
      await sleep(220);
      for (let c = 0; c < SIZE; c++) {
        let emptyRow = SIZE - 1;
        for (let r = SIZE - 1; r >= 0; r--) {
          if (grid[r][c] !== null) {
            grid[emptyRow][c] = grid[r][c];
            if (emptyRow !== r) grid[r][c] = null;
            emptyRow--;
          }
        }
        for (let r = emptyRow; r >= 0; r--) grid[r][c] = randomChip();
      }
      renderBoard();
      await sleep(220);
    }
  }

  function checkEndGame() {
    if (score >= 150) {
      state.stars += 1; state.coins += 45; state.level += 1; updateUI();
      setTimeout(() => { alert('🎉 Победа! Получена Звезда ⭐!'); closeMatch3(); }, 200);
    } else if (moves <= 0) {
      setTimeout(() => { alert('Ходы кончились. Попробуй ещё раз!'); closeMatch3(); }, 200);
    }
  }

  function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }
  updateUI();
</script>
</body>
</html>
